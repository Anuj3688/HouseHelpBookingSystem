server:
  port: 8080

logging:
  level:
    com.househelper: INFO

app:
  encryption:
    # Development-only key. Use a securely managed key for production deployments.
    key: ${HOUSEHELPER_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

spring:
  datasource:
    url: jdbc:h2:mem:househelperdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
